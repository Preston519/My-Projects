<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8s" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color:lightblue;
                font-family:Verdana, Geneva, Tahoma, sans-serif;
            }

            .container {
                display: flex;
                justify-content: center;
                width: 100%;
            }

            .board {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
                gap: 1%;
                width: 90vw;
                max-width: 400px;
                aspect-ratio: 1/1;
                justify-self: center;
            }
            .board button {
                border:none;
                background-color:antiquewhite;
                border-radius: 10%;
                font-size: 500%;
            }

            .board .active {
                cursor: pointer;
            }

            .board .active:hover {
                box-shadow: 2px 2px 5px dimgray;
                border: 2px solid dimgray;
            }

            .reset {
                float: right;
                border: none;
                background-color: lightsteelblue;
                border-radius: 10px;
                cursor: pointer;
                font-size: 200%;
                margin-right: 1%;
            }

            #popupContainer {
                display: none;
                position: fixed;
                background-color: rgba(0,0,0,0.5);
                z-index: 1;
                height: 100%;
                width: 100%;
                left: 0;
                top: 0;
                justify-content: center;
                align-items: center;
            }

            .popupBox {
                height: 40%;
                width: 20%;
                background-color: white;
                padding: 15px;
            }

            #popupClose {
                float: right;
                justify-self: right;
                cursor: pointer;
                margin-right: 2%;
            }

            #popupClose:hover {
                color: lightsteelblue;
            }

            #winText {
                position: relative;
                top: 20%;
                text-align: center;
                width: 100%;
                left: 0;
            }
            
            #popupReset {
                margin: 0;
                position: relative;
                top: 30%;
                left: 50%;
                transform: translate(-50%, 0);
                font-size: 200%;
                background-color: lightsteelblue;
                border-radius: 10px;
                border: none;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="popupContainer">
            <div class="popupBox">
                <span id="popupClose" onclick="closePopup()">&times;</span>
                <br>
                <p id="winText">Somebody has won</p>
                <button id="popupReset" onclick="reset(); closePopup()"><b>&#8634;</b></button>
            </div>
        </div>
        <button class="reset" onclick="reset()">&#8634;</button>
        <div class="container">
            <div class="board">
                <button type="button" class="tbutton active" id="0"></button>
                <button type="button" class="tbutton active" id="1"></button>
                <button type="button" class="tbutton active" id="2"></button>
                <button type="button" class="tbutton active" id="3"></button>
                <button type="button" class="tbutton active" id="4"></button>
                <button type="button" class="tbutton active" id="5"></button>
                <button type="button" class="tbutton active" id="6"></button>
                <button type="button" class="tbutton active" id="7"></button>
                <button type="button" class="tbutton active" id="8"></button>
            </div>
        </div>
        <p style="text-align: center; font-size: 120%;">The current player is <b><span id="currentPlayer"></span></b></p>
        <script>
            let boardFrozen = false
            const vals = [2, 2, 2, 2, 2, 2, 2, 2, 2]
            let count = 0
            let currentPlayer = 0
            const players = ["X", "O"]
            for (button of document.getElementsByClassName("tbutton")) {button.addEventListener("click", buttonClick, {once: true})}
            document.getElementById("currentPlayer").innerText = players[currentPlayer]
            
            function reset() {
                count = 0
                currentPlayer = 0
                document.getElementById("currentPlayer").innerText = players[currentPlayer]
                for (let i = 0; i < 9; i++) {
                    vals[i] = 2
                }
                for (button of document.getElementsByClassName("tbutton")) {
                    button.addEventListener("click", buttonClick, {once:true})
                    button.innerText = ""
                    button.classList.add("active")
                }
                boardFrozen = false
            }

            function buttonClick() {
                if (boardFrozen) {return}
                this.innerText = players[currentPlayer]
                vals[this.id] = currentPlayer
                count++
                checkWin(this.id)
                this.classList.remove("active")
                currentPlayer = (currentPlayer + 1) % 2
                document.getElementById("currentPlayer").innerText = players[currentPlayer]
            }

            function checkWin(n) {
                const col = n % 3
                const row = Math.trunc(n / 3)
                if (
                    (vals[col] != 2 && vals[col] == vals[col+3] && vals[col] == vals[col+6]) ||
                    (vals[row*3] != 2 && vals[row*3] == vals[row*3+1] && vals[row*3] == vals[row*3+2]) ||
                    (vals[4] != 2 && ((vals[0] == vals[4] && vals[0] == vals[8]) ||
                    (vals[2] == vals[4] && vals[2] == vals[6])))
                ) {
                    openPopup(players[currentPlayer] + " has won!")
                } else if (count == 9) {
                    openPopup("Nobody has won")
                }
            }

            function closePopup() {
                document.getElementById("popupContainer").style.display = "none"
            }

            function openPopup(msg) {
                boardFrozen = true
                for (button of document.getElementsByClassName("tbutton")) {
                    button.classList.remove("active")
                }
                document.getElementById("winText").innerText = msg
                document.getElementById("popupContainer").style.display = "flex"
            }
        </script>
    </body>
</html>
