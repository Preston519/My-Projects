<!DOCTYPE html>
<html>
    <head>
        <title>Test page</title>
        <link rel="stylesheet" href="ws_chat.css">
    </head>
    <body>
        <div id="popupBackground">
            <div id="popupBox">
                <form id="login">
                    <label for="username">Username:</label>
                    <input type="text" id="username"><br>
                    <label for="colourpicker">User colour:</label>
                    <input type="color" id="colourpicker"><br>
                    <input type="submit" value="Enter">
                </form>
            </div>
        </div>

        <p id="connecting">&bull; <span id="connText">Connecting...</span></p>
        <p id="text"></p>
        <form id="form">
            <textarea id="textbox" rows="1" form="form"></textarea>
            <input type="submit" id="send" value="Send">
        </form>
        <script src="ws_chat.js" type="module"></script>
    </body>
</html>
